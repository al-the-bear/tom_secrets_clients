name: tom_secrets_provider
description: >-
  The Tom Secrets Manager as a secrets provider for Tom servers: configuration
  values written as secret:local:<reference>#<field> are read from the local
  secrets service. A server that wants it adds this package and registers the
  provider. License: BSD-3-Clause.
version: 0.1.0
homepage: https://enterprise-flutter.dev
repository: https://github.com/al-the-bear/tom_secrets_clients

environment:
  sdk: ^3.10.0

dependencies:
  # The provider contract (TomSecretsProvider), the configuration it is
  # built from and the secret references it answers: the product depends on
  # tom_core, never the reverse.
  tom_core_server: ^1.5.1
  # The secrets service's client protocol (get, the frames, finding it).
  tom_secrets_client: ^0.2.19

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
